<script>
// Each story is a model for board3d.js, the renderer the 3D client uses, so what is shown here is exactly what a duel draws.
const D = DUEL_DATA, $ = id => document.getElementById(id), cond = k => (D.conds[k] || k).replace(' {0}', '');
const fig = D.figures.find(f => f.n === 'Pikachu') || D.figures[0];
const art = f => f.dex <= 1025 ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${f.dex}.png` : '';
const tok = (over, f = fig) => ({ team: 0, img: art(f), name: f.n, mp: String(f.mp), badge: '', status: '', wait: false, mpd: 0, sel: false, atk: false, dim: false, ...over });
// figures side by side (rows of `per`), each one a variation
function row(list, per = 6) {
  const rows = Math.ceil(list.length / per), toks = list.map((t, i) => { const n = Math.min(per, list.length - Math.floor(i / per) * per); return { ...tok(t), i, x: ((i % per) - (n - 1) / 2) * 1.7, z: (Math.floor(i / per) - (rows - 1) / 2) * 2 }; });
  return { pts: [], slots: [], edges: [], toks, snap: true, cam: { pos: [0, 2.2 + rows * 1.6, 5 + rows * 1.2].map(v => v * Math.min(1, (Math.min(per, list.length) + 3) / 5)), at: [0, .3, 0], width: Math.min(per, list.length) * 1.7 + 1.2 } };
}
// the table as a duel lays it out (bottom player's view)
const P = p => p < 28 ? [(42 + XY[p][0] * 56 - 210) / 54.2, (186 + XY[p][1] * 82 - 350) / 54.2] : [-SPOT[p][0], SPOT[p][1]];
function table(mv = [], toks = []) {
  const pts = []; for (let p = 0; p < 28; p++) pts.push({ k: p, p, x: P(p)[0], z: P(p)[1], goal: p === 24 ? 0 : p === 3 ? 1 : null, mv: mv.includes(p) });
  const slots = []; for (let p = 28; p < 44; p++) slots.push(P(p));
  return { pts, slots, edges: EDGES.map(([a, b]) => [P(a), P(b)]), toks: toks.map((t, i) => ({ ...tok(t, t.f || fig), i, x: t.out != null ? (t.team ? -120 + t.out * 48 : 120 - t.out * 48) / 54.2 : P(t.at)[0], z: t.out != null ? (t.team ? -7.01 : 7.01) : P(t.at)[1] })), snap: true };   // `out: n` = the n-th excluded figure of its side
}
const STATUS = ['poison', 'bad_poison', 'burn', 'paralyze', 'sleep', 'freeze', 'panic', 'curse'], MARKERS = Object.keys(D.conds).filter(k => !D.conds[k].includes('{0}') && !STATUS.includes(k) && !/^mp_|^plus_|faint|melt/.test(k));
const mpd = d => ({ mp: String(fig.mp + d), mpd: d, badge: d ? 'MP ' + (d > 0 ? '+' : '') + d : 'normal' });
const some = n => D.figures.filter(f => f.dex <= 1025 && !/ /.test(f.n)).slice(0, n);
const named = n => D.figures.find(f => f.n === n);
// one figure per line, on the points given. `branch` means the first form can become any of the later ones, rather than each stage in order.
function evoTable(lines, ats) {
  const toks = [];
  lines.forEach((spec, i) => {
    const names = Array.isArray(spec) ? spec : spec.names, branch = !Array.isArray(spec) && !!spec.branch;
    const chain = names.map(named).filter(Boolean);
    if (chain.length < 2) return;
    const f = chain[0];
    toks.push({ f, at: ats[i], evo: true, chain, branch, step: 0, mp: String(f.mp) });
  });
  return table([], toks);
}
const STORIES = {
  Figure: {
    'Blue team (you)': ['A figure on its base. The base carries the team colour; the number is its movement points.', () => row([{}])],
    'Red team (opponent)': ['', () => row([{ team: 1 }])],
    'Both teams': ['', () => row([{ badge: 'blue' }, { team: 1, badge: 'red' }])],
    'Selected': ['Gold ring: the figure you picked.', () => row([{ sel: true }])],
    'Attack target': ['Red ring: a figure the selected one can battle.', () => row([{ team: 1, atk: true }])],
    'In the P.C.': ['Faded while it waits in the P.C.', () => row([{ dim: true, mp: '' }])],
    'No picture': ['Figures without a picture show their name.', () => row([{ img: '', name: 'Wash Rotom' }])],
    'Interaction states': ['', () => row([{ badge: 'idle' }, { sel: true, badge: 'selected' }, { team: 1, atk: true, badge: 'target' }, { dim: true, mp: '', badge: 'P.C.' }])],
  },
  'Status conditions': Object.fromEntries([...STATUS.map(k => [cond(k), ['Coloured aura under the base, with the condition named below.', () => row([{ status: k, badge: cond(k) }])]]),
    ['All status conditions', ['', () => row(STATUS.map(k => ({ status: k, badge: cond(k) })), 4)]]]),
  'Movement points': Object.fromEntries([...[-3, -2, -1, 0, 1, 2].map(d => [d ? 'MP ' + (d > 0 ? '+' : '') + d : 'MP unchanged', ['The MP badge turns red when lowered and green when raised.', () => row([mpd(d)])]]),
    ['All MP changes', ['', () => row([-3, -2, -1, 0, 1, 2].map(mpd))]]]),
  'Wait and damage': {
    'Wait 1': ['A waiting figure is greyed and shows the turns left.', () => row([{ wait: true, badge: 'wait 1' }])],
    'Wait 1 to 3': ['', () => row([1, 2, 3].map(n => ({ wait: true, badge: 'wait ' + n })))],
    'Damage changes': ['', () => row(['-20 dmg', '+10 dmg', '+20 dmg'].map(b => ({ badge: b })))],
    'Status with wait': ['Several states at once are listed together.', () => row([{ status: 'sleep', wait: true, badge: 'asleep · wait 2' }, { status: 'burn', mpd: -1, mp: String(fig.mp - 1), badge: 'burned' }])],
  },
  'Other markers': { 'All markers': ['Every other marker the engine can put on a figure. They share a white aura.', () => row(MARKERS.map(k => ({ status: k, badge: cond(k) })), 7)] },
  Table: {
    'Empty table': ['Field points, routes, both goals, bench rings and P.C. rings.', () => table()],
    'Movable points': ['Points the selected figure can reach glow gold.', () => table([21, 22, 23, 16, 17, 18, 25, 26, 27, 19, 20], [{ at: 28, sel: true }])],
    'Opening position': ['Six figures on each bench.', () => table([], some(12).map((f, i) => ({ f, at: i < 6 ? 28 + i : 34 + i - 6, team: i < 6 ? 0 : 1, mp: String(f.mp) })))],
    'Excluded figures': ['Figures removed from the duel sit in a row past their side\'s bench: yours along the near edge, the opponent\'s along the far edge.', () => table([], some(10).map((f, i) => i < 3 ? { f, out: i, team: 0, dim: true, mp: '' } : i < 5 ? { f, out: i - 3, team: 1, dim: true, mp: '' } : { f, at: [28, 29, 34, 35, 18][i - 5], team: i < 7 || i === 9 ? 0 : 1, mp: String(f.mp) }))],
    'Mid duel': ['', () => table([], some(8).map((f, i) => ({ f, at: [24, 18, 13, 29, 3, 9, 14, 35][i], team: i < 4 ? 0 : 1, mp: String(f.mp), status: i === 1 ? 'burn' : i === 5 ? 'freeze' : '', badge: i === 1 ? 'burned' : i === 5 ? 'frozen' : '' })))],
  },
  Evolution: {
    'Magikarp': ['One evolution. A glowing ball blasts open, then the figure on the table is the next form. Click Evolve to play the next step now.', () => evoTable([['Magikarp', 'Gyarados']], [14])],
    'Charmander line': ['Each stage plays in turn, then the line starts again.', () => evoTable([['Charmander', 'Charmeleon', 'Charizard']], [14])],
    'Eevee': ['Eevee can become any of these. Each one plays from Eevee, then the next.', () => evoTable([{ branch: true, names: ['Eevee', 'Vaporeon', 'Jolteon', 'Flareon', 'Espeon', 'Umbreon'] }], [14])],
    'Starter lines': ['Bulbasaur, Charmander and Squirtle, one line after another.', () => evoTable([['Bulbasaur', 'Ivysaur', 'Venusaur'], ['Charmander', 'Charmeleon', 'Charizard'], ['Squirtle', 'Wartortle', 'Blastoise']], [8, 14, 20])],
  },
  Sounds: {
    'Figure sounds': ['Every clip the original game names for something that happens to a figure. The list under the table is the whole set.', () => ({ ...row([{ badge: 'figure sounds' }]), catalog: true })],
  },
};
// Clips named in the original client's sound list for a figure. The 7.0.16 APK contains Se001 (decide) and Se002 (cancel) only;
// every clip below is downloaded, so the page plays its stand-in and the line under the table names the original clip.
const MISSING = 'recording is not in the 7.0.16 APK, so the stand-in plays';
const COND_SOUND = {
  poison: ['Se091', 'Poisoned', 'st_poison'], bad_poison: ['Se092', 'Badly poisoned', 'st_bad_poison'],
  burn: ['Se093', 'Burned', 'st_burn'], paralyze: ['Se090', 'Paralyzed', 'st_paralyze'], sleep: ['Se089', 'Asleep', 'st_sleep'],
  freeze: ['Se094', 'Frozen', 'st_freeze'], melt: ['Se094', 'Frozen', 'st_freeze'], panic: ['Se088', 'Confused', 'st_panic'], curse: ['Se095', 'Cursed', 'st_curse'],
  charge: ['Se096', 'Charged', 'ability'], flame_charge: ['Se096', 'Charged', 'ability'], ice_charge: ['Se096', 'Charged', 'st_freeze'], thunder_charge: ['Se096', 'Charged', 'st_paralyze'],
  lock_on: ['Se097', 'Lock-On', 'st_other'], imprison: ['Se107', 'Restrained', 'st_curse'], gliding: ['Se109', 'Flight', 'st_other'], disappeared: ['Se111', 'Excluded', 'st_other'],
  mp_minus_1: ['Se098', 'Slowed', 'mp_down'], mp_minus_2: ['Se098', 'Slowed', 'mp_down'], mp_minus_3: ['Se098', 'Slowed', 'mp_down'],
  plus_10: ['Se099', 'A small marker is added', 'mp_up'], plus_20: ['Se100', 'A medium marker is added', 'mp_up'], faint: ['Se038', 'Knocked out, to the P.C.', 'ko']
};
const FIGURE_SOUNDS = [
  ['Se011', 'A figure is set on the table', 'land'],
  ['Se017_2', 'Evolution finishes', 'evolve'],
  ['Se028', 'A figure is selected', 'select'],
  ['Se029', 'Figure selection cancelled', 'cancel'],
  ['Se031', 'Figure steps across plaster', 'step'],
  ['Se032', 'Figure steps across glass', 'step'],
  ['Se033', 'Figure steps across metal', 'step'],
  ['Se034', 'The computer moves a figure', 'step'],
  ['Se038', 'A knocked-out figure moves to the P.C.', 'ko'],
  ['Se039', 'Evolution starts', 'evolve'],
  ['Se048', 'A figure swaps or makes a special move', 'step'],
  ['Se049', 'The last figure is set on the table', 'land'],
  ['Se056', 'Figure steps across wood', 'step'],
  ['Se068', 'An ordinary hit lands', 'hit'],
  ['Se087', 'A status condition is inflicted', 'st_other'],
  ['Se088', 'Confused', 'st_panic'],
  ['Se089', 'Asleep', 'st_sleep'],
  ['Se090', 'Paralyzed', 'st_paralyze'],
  ['Se091', 'Poisoned', 'st_poison'],
  ['Se092', 'Badly poisoned', 'st_bad_poison'],
  ['Se093', 'Burned', 'st_burn'],
  ['Se094', 'Frozen', 'st_freeze'],
  ['Se095', 'Cursed', 'st_curse'],
  ['Se096', 'Charged', 'ability'],
  ['Se097', 'Lock-On', 'st_other'],
  ['Se098', 'Slowed', 'mp_down'],
  ['Se099', 'A small marker is added', 'mp_up'],
  ['Se100', 'A medium marker is added', 'mp_up'],
  ['Se101', 'A large marker is added', 'mp_up'],
  ['Se102', 'A marker is lowered', 'mp_down'],
  ['Se103', 'Wait', 'wait'],
  ['Se104', 'Ice marker', 'st_freeze'],
  ['Se105', 'Ground marker', 'st_other'],
  ['Se106', 'Water marker', 'st_other'],
  ['Se107', 'Restrained', 'st_curse'],
  ['Se108', 'Sent back', 'step'],
  ['Se109', 'Flight', 'st_other'],
  ['Se110', 'Sealed', 'st_other'],
  ['Se111', 'Excluded', 'st_other'],
  ['Se112', 'Siren', 'st_other'],
  ['Se121', 'A helpful ability is granted', 'ability'],
  ['Se122', 'A harmful ability is granted', 'st_curse'],
  ['Se125', 'A figure action is cancelled', 'cancel'],
  ['Se127', 'The first step of a move', 'step'],
  ['Se131', 'The evolved figure lands', 'land'],
  ['Se143', 'The evolved figure comes down', 'land'],
  ['Se165', 'Sparks as the evolution bursts', 'evolve'],
  ['Se196', 'Fainted, as a status', 'ko'],
  ['Se233', 'A figure appears on the battle screen', 'select']
];
function dmgSound(t) {
  const b = t.badge || ''; if (!/dmg/.test(b)) return null;
  if (b.startsWith('-')) return ['Se102', 'A marker is lowered', 'mp_down'];
  if (b.includes('20')) return ['Se100', 'A medium marker is added', 'mp_up'];
  return ['Se099', 'A small marker is added', 'mp_up'];
}
function soundsFor(t) {
  const rows = [];
  if (t.chain) rows.push(['Se039', 'Evolution starts'], ['Se165', 'Sparks as the evolution bursts'], ['Se017_2', 'Evolution finishes'], ['Se131', 'The evolved figure lands']);
  if (t.status && COND_SOUND[t.status]) rows.push(COND_SOUND[t.status]);
  else if (t.status) rows.push(['', cond(t.status) + ' has no clip of its own in the sound list']);
  if (t.mpd > 0) rows.push([t.mpd >= 3 ? 'Se101' : t.mpd === 2 ? 'Se100' : 'Se099', 'MP raised']);
  if (t.mpd < 0) rows.push(['Se102', 'MP lowered']);
  if (t.wait) rows.push(['Se103', 'Wait']);
  if (t.out != null) rows.push(['Se111', 'Excluded']);
  else if (t.dim) rows.push(['Se038', 'Knocked out, to the P.C.']);
  if (t.sel) rows.push(['Se028', 'A figure is selected']);
  if (t.atk) rows.push(['Se068', 'An ordinary hit lands when the battle starts. The red ring itself is silent.']);
  const dmg = dmgSound(t); if (dmg) rows.push(dmg);
  if (!rows.length && !t.atk) rows.push(['Se011', 'A figure is set on the table']);
  return rows;
}
function soundText(m) {
  if (m.catalog) return 'Se001  Decide (original recording, UI)\nSe002  Cancel (original recording, UI)\n' + FIGURE_SOUNDS.map(s => s[0] + '  ' + s[1] + '\n       ' + MISSING).join('\n');
  const lines = [], seen = new Set();
  for (const t of m.toks) for (const [id, name] of soundsFor(t)) { const line = (id ? id + '  ' : '') + name; if (!seen.has(line)) { seen.add(line); lines.push(line); } }
  return lines.length ? lines.join('\n') + '\n' + MISSING : '';
}
let current = null;
function show(group, name) {
  stopEvo();
  const [note, make] = STORIES[group][name], m = make(); current = m;
  const heard = soundText(m);
  $('title').textContent = group + ' / ' + name; $('note').textContent = note; location.hash = encodeURIComponent(group + '/' + name);
  const body = m.toks.some(t => t.chain) ? m.toks.filter(t => t.chain).map(t => t.branch ? t.chain[0].n + ' → ' + t.chain.slice(1).map(f => f.n).join(' / ') : t.chain.map(f => f.n).join(' → ')).join('\n')
    : m.toks.map(t => JSON.stringify({ team: t.team, mp: t.mp, mpd: t.mpd, status: t.status, wait: t.wait, badge: t.badge, sel: t.sel, atk: t.atk, dim: t.dim })).join('\n') || '(no figures)';
  $('props').textContent = heard ? heard + '\n\n' + body : body;
  for (const b of $('nav').querySelectorAll('button')) b.classList.toggle('on', b.dataset.g === group && b.dataset.n === name);
  // A story whose figures carry a status condition or an MP change shows them without it first; after a second it is applied (ring, tint,
  // lettering, badge) and its sound plays, the way it arrives during a duel.
  (show.timers || []).forEach(clearTimeout); show.timers = [];
  const draw = x => { window.board3dModel = x; if (window.Board3D) Board3D.draw(x); };
  // what arrives after the story opens, in order: each status condition, then each figure's MP change
  const playStatus = kind => { const row = COND_SOUND[kind]; if (row) sfx(row[2]); else statusSfx(kind); };
  const arrivals = [...new Set(m.toks.map(t => t.status).filter(Boolean))].map(kind => ({ hits: t => t.status === kind, sound: () => playStatus(kind) }))
    .concat(m.toks.filter(t => t.mpd).map(t => ({ hits: x => x === t, sound: () => mpSfx(t.mpd) })))
    .concat(m.toks.filter(t => t.wait).map(t => ({ hits: x => x === t, sound: () => sfx('wait') })))
    .concat(m.toks.filter(t => t.out != null).map(t => ({ hits: x => x === t, sound: () => sfx('st_other') })))
    .concat(m.toks.filter(t => t.dim && t.out == null).map(t => ({ hits: x => x === t, sound: () => sfx('ko') })))
    .concat(m.toks.filter(t => t.sel).map(t => ({ hits: x => x === t, sound: () => sfx('select') })))
    .concat(m.toks.filter(t => dmgSound(t)).map(t => ({ hits: x => x === t, sound: () => sfx(dmgSound(t)[2]) })));
  if (!arrivals.length) {
    draw(m); startEvo();
    if (m.catalog) FIGURE_SOUNDS.forEach((s, k) => show.timers.push(setTimeout(() => { if (current !== m) return; $('note').textContent = s[0] + '  ' + s[1]; sfx(s[2]); }, 700 + k * 650)));
    else if (m.toks.some(t => !t.atk && !t.chain)) show.timers.push(setTimeout(() => sfx('land'), 400));
    return;
  }
  const plain = t => ({ ...t, status: '', wait: false, mpd: 0, mp: t.mpd ? String(+t.mp - t.mpd) : t.mp, badge: t.status || t.mpd || t.wait || t.dim || t.sel || dmgSound(t) ? '' : t.badge, dim: false, sel: false });
  const upTo = n => ({ ...m, toks: m.toks.map(t => arrivals.findIndex(a => a.hits(t)) >= n ? plain(t) : t) });   // only the first n arrivals applied
  draw(upTo(0));
  arrivals.forEach((a, k) => show.timers.push(setTimeout(() => { draw(upTo(k + 1)); a.sound(); }, 1000 + k * 600)));
}

for (const g in STORIES) { $('nav').insertAdjacentHTML('beforeend', `<h2>${g}</h2>`); for (const n in STORIES[g]) { const b = document.createElement('button'); b.textContent = n; b.dataset.g = g; b.dataset.n = n; b.onclick = () => show(g, n); $('nav').appendChild(b); } }
let evoJob = 0;
function stopEvo() { evoJob++; const el = $('evoanim'); if (el) { el.hidden = true; el.innerHTML = ''; } if (window.Board3D && Board3D.clearBlasts) Board3D.clearBlasts(); }
function evoSleep(ms, job) {   // ends early when Evolve is clicked (current.rush) or the story changes
  return new Promise(resolve => {
    const done = ok => { clearInterval(id); clearTimeout(t); resolve(ok); };
    const t = setTimeout(() => done(job === evoJob), ms);
    const id = setInterval(() => { if (job !== evoJob) done(false); else if (current && current.rush) { current.rush = false; done(true); } }, 40);
  });
}
function showForm(t, step) {

async function startEvo() {
